name: test_multi

fixed_window: null  # integer if window_method = 'fixed', else null
entry_threshold: 2.0
exit_threshold: 0.0
stop_loss: 2.0

pair_selection:
  top_n_factor: 20
  coint_type: "eg" # "eg" or "johansen"

  start: "2023-11-01"
  end: "2024-01-01"

performance:
  iterations: 12 # integer >= 1

  beta_method: "ols" # "ols" or "kalman"
  beta_hedge: "static" # "static", "rolling", or "no_hedge"
  window_method: "static" # "fixed", "static", or "rolling"

  delayed_entry: True # True or False
  sl_lock: True
  time_decay_start: 0.5
  time_decay_end: 1.0

  rl: False
  rl_reward: "pnl" # "pnl" or "risk_adj"

  vol_window: 24
  window_min: 48
  window_max: 336

  test:
    win_start: "2023-12-01"
    start: "2024-01-01"
    end: "2024-02-01"

defaults:
  - _self_
  - base
  - rl_algo: "a2c_baseline" # "a2c_baseline" or "recurrent_ppo"
