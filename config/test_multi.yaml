name: test_multi

fixed_window: 168  # integer if window_method = 'fixed', else null
entry_threshold: 3.0
exit_threshold: 0.0
stop_loss: 2.0

generate_plots: True

rl:
  use: False
  model_name: "recurrent_ppo_standard_abc123_seed42"

pair_selection:
  top_n_factor: 20
  coint_type: "eg" # "eg" or "johansen"

  start: "2023-11-01"
  end: "2024-01-01"

performance:
  iterations: 12 # integer >= 1

  beta_method: "ols" # "ols" or "kalman"
  beta_hedge: "rolling" # "static", "rolling", or "no_hedge"
  window_method: "fixed" # "fixed", "static", or "rolling"

  delayed_entry: True # True or False
  sl_lock: True
  time_decay_sl: False # True or False

  vol_window: 24
  window_min: 48
  window_max: 336

  test:
    win_start: "2023-12-01"
    start: "2024-01-01"
    end: "2024-02-01"

defaults:
  - _self_
  - base
  - rl_algo: "a2c_baseline" # "a2c_baseline" or "recurrent_ppo"
