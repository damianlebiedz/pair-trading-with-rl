name: train_agent

defaults:
  - _self_
  - base
  - rl_algo: recurrent_ppo # 'a2c_baseline' or 'recurrent_ppo'

rl:
  training_subfolder: "WINNER_5_hybrid_fixed"
  reward: "pnl" # "pnl" or "diff_sharpe"
  passes_per_pair: 10
  seed: 42
  verbose: 1
  obs_space_type: "minimal" # "full", "standard", or "minimal"
