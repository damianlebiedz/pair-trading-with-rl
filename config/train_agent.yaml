defaults:
  - _self_
  - base
  - rl_algo: recurrent_ppo

rl:
  training_folder: null
  reward: AsymmetricReward
  reward_lambda: 1.0
  obs_space_type: standard
  passes_per_pair: 50
  seed: 42
  verbose: 1
  freeze_std: true
  time_decay_stop: true
