name: train_agent

defaults:
  - _self_
  - base
  - rl_algo: a2c_baseline # 'a2c_baseline' or 'recurrent_ppo'

rl:
  training_subfolder: "WINNER_5_hybrid_fixed"
  reward: "risk_adj" # "pnl", "risk_adj", or "diff_sharpe"
  passes_per_pair: 200
  seed: 42
  verbose: 1
  obs_space_type: "full" # "full", "standard", or "minimal"
