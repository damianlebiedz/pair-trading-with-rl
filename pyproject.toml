[project]
name = "research-paper"
version = "0.1.0"
description = ""
authors = [
    {name = "Damian Lebiedź"}
]
license = {text = "Proprietary"}
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "pandas>=2.2.0",
    "python-binance>=1.0.0",
    "tqdm>=4.66.0",
    "numpy<2.0.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.8.0",
    "statsmodels>=0.14.0",
    "scikit-optimize>=0.9.0",
    "scipy<1.14.0",
    "joblib>=1.4.0",
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.3.0",
    "hydra-core>=1.3.2",
    "wandb>=0.16.0",
    "pyarrow>=15.0.0",
    "plotly (>=6.5.1,<7.0.0)"
]


[tool.poetry]
packages = [{ include = "modules" }]

[tool.poetry.group.dev.dependencies]
ruff = "^0.3.0"
mypy = "^1.9.0"
black = "^24.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"