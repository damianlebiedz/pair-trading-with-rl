x-base: &base_config
  image: research-paper-base
  env_file:
    - .env
  volumes:
    - ./config:/app/config
    - ./data:/app/data
    - ./data_rl/models:/app/models
    - ./data_rl/training_data:/app/training_data
    - ./results:/app/results
  environment:
    - HYDRA_FULL_ERROR=1
    - PYTHONPATH=/app

services:
  run_backtest:
    <<: *base_config
    command: python runners/run_backtest.py

  train_agent:
    <<: *base_config
    command: python runners/train_agent.py