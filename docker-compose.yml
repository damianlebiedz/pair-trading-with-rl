x-base: &base_config
  build: .
  image: research-paper-base
  env_file:
    - .env
  volumes:
    - ./config:/app/config
    - ./data:/app/data
    - ./models:/app/models
    - ./training_data:/app/training_data
    - ./tensorboard_logs:/app/tensorboard_logs
  environment:
    - HYDRA_FULL_ERROR=1

services:
  train_agent:
    <<: *base_config
    command: python runners/train_agent.py

  pair_selection:
    <<: *base_config
    command: python runners/pair_selection.py

  test:
    <<: *base_config
    command: python runners/test.py

  test_multi:
    <<: *base_config
    command: python runners/test_multi.py

  opt_and_test_multi:
    <<: *base_config
    command: python runners/opt_and_test_multi.py
