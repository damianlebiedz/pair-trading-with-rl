fixed_window: None  # integer if window_method = 'fixed', else None
entry_threshold: 2.5
exit_threshold: 0.2
stop_loss: 2

pair_selection:
  top_n_factor: 10
  coint_type: "johansen" # "eg" or "johansen"

  start: "2023-11-01"
  end: "2024-01-01"

performance:
  iterations: 12 # integer >= 1

  beta_method: "kalman" # "ols", "johansen" or "kalman"
  beta_hedge: "static" # "static" or "rolling"
  window_method: "rolling" # "fixed", "static", or "rolling"

  delayed_entry: True # True or False
  sl_lock: True
  time_decay_start: 0.5
  time_decay_end: 1.0

  rl: False
  rl_reward: "pnl" # "pnl" or "risk_adj"

  vol_window: 24
  window_min: 48
  window_max: 336

  test:
    win_start: "2023-12-01"
    start: "2024-01-01"
    end: "2024-02-01"

defaults:
  - /base
  - rl_algo: "a2c_baseline" # "a2c_baseline" or "recurrent_ppo"
