defaults:
  - _self_
  - agent: a2c_baseline

hydra:
  run:
    dir: results/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null

market:
  initial_cash: 100000
  fee_rate: 0.0005
  risk_free_rate_annual: 0.01
  interval: "1h"

pair_selection:
  start: "2024-01-01"
  end: "2024-03-01"

  tickers: [ "BTCUSDT", "ETHUSDT", "BNBUSDT", "SOLUSDT", "XRPUSDT", "ADAUSDT", "AVAXUSDT", "DOGEUSDT", "TRXUSDT",
             "DOTUSDT", "LINKUSDT", "SHIBUSDT", "LTCUSDT", "BCHUSDT", "UNIUSDT" ]

performance:
  window: rolling # "rolling", "static", or int > 1
  source: "log" # "log", "c_returns", "c_log_returns", "c_norm_returns"
  beta_hedge: # "dynamic", "static", None (exactly nothing -> 'beta_hedge: ')

  optimization:
    beta_start: "2024-01-01"
    start: "2024-02-01"
    end: "2024-03-01"

    # Bayesian-Search parameters
    n_iter: 100
    random_state: 42
    replicates: 1
    penalty_bad: -100

  test:
    beta_start: "2024-01-01"
    start: "2024-03-01"
    end: "2024-04-01"
