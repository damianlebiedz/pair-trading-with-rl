pair_selection:
  eg_factor: 0.05
  method: "both" # "both" or "second"

  optimization:
    start: "2024-01-01"
    end: "2024-07-01"

  test:
    start: "2024-03-01"
    end: "2024-09-01"

performance:
  window: "static" # "rolling", "static" or "fixed"
  source: "log" # "log", "c_returns", "c_log_returns", "c_norm_returns"
  beta_hedge: "static" # "dynamic", "static", None (exactly nothing -> 'beta_hedge: ')

  optimization:
    beta_start: "2024-01-01"
    start: "2024-07-01"
    end: "2024-09-01"

    # Bayesian-Search parameters
    n_iter: 1000
    replicates: 2
    penalty_bad: -100

  test:
    beta_start: "2024-03-01"
    start: "2024-09-01"
    end: "2024-11-01"
