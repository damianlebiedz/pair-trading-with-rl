pair_selection:
  top_n_factor: 10
  coint_type: "johansen" # "eg" or "johansen"
  beta_validation: False
  window_validation: False

  start: "2023-11-01"
  end: "2024-01-01"

performance:
  beta_method: "kalman" # "ols", "johansen" or "kalman"
  delayed_entry: True # True or False
  time_decay_start: 0.5
  time_decay_end: 1.0

  beta_hedge: "static" # "static" or "rolling"

  iterations: 12 # integer >= 1

  rl_reward: "pnl" # "pnl" or "risk_adj"

  vol_window: 24
  window_min: 48
  window_max: 336

  optimization:
    objective_func: "sortino" # "sortino"
    metric_type: "net" # "gross" or "net"

    win_start: "2023-11-01"
    start: "2023-12-01"
    end: "2024-01-01"

    # Search parameters
    n_iter: 300
    replicates: 1
    penalty_bad: -100

    fixed_window: False

    # Parameters space
    entry_threshold_min: 1.50
    entry_threshold_max: 3.50

    exit_threshold_min: 0.00
    exit_threshold_max: 0.50

    stop_loss_min: 1.05
    stop_loss_max: 3.00

    # Objective parameters
    min_trades_per_pair: 5

  test:
    win_start: "2023-12-01"
    start: "2024-01-01"
    end: "2024-02-01"
